<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>10 / CCTV GRID</title>
<link rel="stylesheet" href="base.css">
<style>
  #stage { background: #030805; }
  .views { position: absolute; left: 62px; top: 148px; right: 62px; bottom: 150px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; }
  .cam { position: relative; overflow: hidden; border: 1px solid rgba(120,255,170,.22); background: #04100a; }
  .cam img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) brightness(.55) contrast(1.5) sepia(.2); }
  .tint { position: absolute; inset: 0; background: rgba(40,255,140,.28); mix-blend-mode: multiply; }
  .scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(180,255,220,.10) 0 1px, transparent 1px 4px); }
  .cam .no { position: absolute; left: 14px; top: 12px; font-family: "Fira Code"; font-size: 14px; letter-spacing: .16em; color: rgba(190,255,220,.9); }
  .cam .ts { position: absolute; right: 14px; bottom: 12px; font-family: "Fira Code"; font-size: 15px; color: rgba(210,255,235,.9); }
  .cam .rec { position: absolute; right: 14px; top: 12px; font-family: "Fira Code"; font-size: 13px; color: #ff6b6b; }
  .ticker { position: absolute; left: 62px; right: 62px; bottom: 74px; height: 48px; overflow: hidden; border-top: 2px solid rgba(255,70,90,.85); border-bottom: 1px solid rgba(255,70,90,.4); background: rgba(60,0,10,.5); }
  .ticker span { position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 900; font-size: 19px; line-height: 48px; color: #ffd7dd; letter-spacing: .10em; }
  .bigclock { position: absolute; right: 76px; top: 48px; font-family: "Fira Code"; font-size: 24px; letter-spacing: .14em; color: rgba(190,255,220,.9); }
  .label-g { color: rgba(140,220,180,.6); }
  #stage::before { opacity: .25; }
</style>
</head>
<body>
<div id="stage">
  <div class="grid" style="opacity:.25"></div>
  <div class="hud-top">
    <div><div class="hud-title" style="color:#c9ffe2">SURVEILLANCE</div><div class="hud-sub label label-g">ACADEMY CITY / CCTV NETWORK</div></div>
    <div class="hud-right"><div class="bigclock" id="clock">00:00:00</div><div class="hud-sub"><span class="tag" style="color:#8cffb0;border-color:rgba(140,255,176,.35)">LIVE</span></div></div>
  </div>

  <div class="views">
    <div class="cam"><img src="../assets/ai/02_city_rain.jpg"><div class="tint"></div><div class="scan"></div><div class="no">CAM-01 / STREET</div><div class="rec">● REC</div><div class="ts" data-ts="1"></div></div>
    <div class="cam"><img src="../assets/ai/06_rooftop.jpg"><div class="tint"></div><div class="scan"></div><div class="no">CAM-02 / ROOFTOP</div><div class="rec">● REC</div><div class="ts" data-ts="2"></div></div>
    <div class="cam"><img src="../assets/ai/09_alley.jpg"><div class="tint"></div><div class="scan"></div><div class="no">CAM-03 / ALLEY</div><div class="rec">● REC</div><div class="ts" data-ts="3"></div></div>
    <div class="cam"><img src="../assets/ai/16_train_platform.jpg"><div class="tint"></div><div class="scan"></div><div class="no">CAM-04 / PLATFORM</div><div class="rec">● REC</div><div class="ts" data-ts="4"></div></div>
  </div>

  <div class="ticker"><span id="ticker">BREAKING / 学園都市第七学区で大規模な電磁波異常を観測　交通機関に遅延</span></div>
</div>
<script src="app.js"></script>
<script>
const DUR = 2.26;
const msg = 'BREAKING / 学園都市第七学区で大規模な電磁波異常を観測　交通機関に遅延　現地からの情報を待っています　';
function frame(t) {
  document.getElementById('clock').textContent = `20:${String(44 + Math.floor(t)).padStart(2, '0')}:${String(Math.floor(t * 30) % 60).padStart(2, '0')}`;
  document.querySelectorAll('.ts').forEach((el, i) => {
    el.textContent = `2026-11-05 20:${String(44 + Math.floor(t)).padStart(2, '0')}:${String((i * 7 + Math.floor(t * 30)) % 60).padStart(2, '0')}`;
  });
  const span = document.getElementById('ticker');
  span.textContent = '● BREAKING / 学園都市第七学区で大規模な電磁波異常を観測　交通機関に遅延　現地からの情報を待っています';
  span.style.top = Math.round((48 - 24) / 2) + 'px';
  document.querySelectorAll('.cam').forEach((el, i) => {
    el.style.boxShadow = `inset 0 0 0 1px rgba(120,255,170,${.08 + .12 * RG.hash(i + Math.floor(t * 8))})`;
    el.querySelector('img').style.transform = `scale(${1.03 + .02 * Math.sin(t * 3 + i)}) translate(${Math.sin(t + i) * 2}px, ${Math.cos(t * 1.3 + i) * 2}px)`;
  });
}
__boot(frame, DUR);
</script>
</body>
</html>
