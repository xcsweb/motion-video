<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>02 / FIRE CONTROL</title>
<link rel="stylesheet" href="base.css">
<style>
  .wrap { position: absolute; inset: 132px 72px 92px; display: grid; grid-template-columns: 1.15fr .85fr; gap: 56px; }
  .left, .right { position: relative; }
  .big { font-family: "Lato", sans-serif; font-weight: 900; font-size: 150px; line-height: 1; letter-spacing: -.02em; }
  .big span { font-size: 54px; color: var(--cyan); margin-left: 10px; }
  .bars { display: flex; gap: 7px; margin-top: 26px; }
  .bar { flex: 1; height: 18px; background: rgba(0,225,255,.08); border: 1px solid rgba(0,225,255,.18); }
  .bar.on { background: linear-gradient(90deg, #00a8ff, #7ef9ff); box-shadow: 0 0 14px rgba(0,225,255,.6); }
  .bar.hot { background: linear-gradient(90deg, #ff8a3c, #ffd36e); box-shadow: 0 0 16px rgba(255,160,60,.65); }
  .tele { margin-top: 52px; font-family: "Fira Code", monospace; font-size: 16px; color: var(--dim); }
  .tele div { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(0,225,255,.10); }
  .tele b { color: var(--ink); font-weight: 400; }
  .cannon { position: absolute; left: 0; top: 0; width: 640px; height: 480px; }
  .stamp { position: absolute; right: 0; bottom: 0; width: 260px; height: 260px; border: 2px solid rgba(255,46,209,.5); border-radius: 50%; display: grid; place-items: center; transform: rotate(-11deg); }
  .stamp div { text-align: center; color: var(--mag); font-family: "Fira Code", monospace; letter-spacing: .18em; }
  #fire { position: absolute; left: 72px; bottom: 108px; font-family: "Lato", sans-serif; font-weight: 900; font-size: 210px; letter-spacing: .06em; color: #fff; text-shadow: 0 0 40px rgba(255,120,40,.9), 8px 0 rgba(255,46,209,.5), -8px 0 rgba(0,225,255,.5); opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div class="grid"></div>
  <div class="hud-top">
    <div><div class="hud-title">FIRE CONTROL</div><div class="hud-sub label">RAILGUN SYSTEM / CHARGE SEQUENCE</div></div>
    <div class="hud-right"><div class="label" id="clock">00:00:00</div><div class="hud-sub"><span class="tag">ARMED</span></div></div>
  </div>

  <div class="wrap">
    <div class="left">
      <svg class="cannon" viewBox="0 0 520 420">
        <defs>
          <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2a3f52"/><stop offset=".45" stop-color="#0b1622"/><stop offset="1" stop-color="#050a10"/>
          </linearGradient>
        </defs>
        <g stroke="rgba(0,225,255,.5)" fill="none">
          <path d="M20 300 L300 150 L380 175 L380 235 L120 360 Z" fill="url(#metal)" stroke-width="1.5"/>
          <path d="M300 150 L470 118 L500 146 L500 190 L380 235" fill="#0a1420" stroke-width="1.5"/>
          <ellipse cx="480" cy="156" rx="26" ry="52" stroke="rgba(0,225,255,.85)" stroke-width="2"/>
          <ellipse cx="480" cy="156" rx="14" ry="34" stroke="rgba(255,46,209,.7)"/>
        </g>
        <g fill="rgba(0,225,255,.75)" font-family="Fira Code" font-size="11">
          <text x="28" y="318">COIL-01</text><text x="150" y="270">COIL-02</text><text x="286" y="212">COIL-03</text>
        </g>
        <g id="coils"></g>
      </svg>
    </div>

    <div class="right">
      <div class="label">CAPACITOR BANK</div>
      <div class="big" id="pct">000<span>%</span></div>
      <div class="bars" id="bars"></div>
      <div class="tele" id="tele"></div>
      <div class="stamp"><div><div style="font-size:22px">LIMIT</div><div style="font-size:46px;margin:6px 0">98.7</div><div style="font-size:14px">EXCEED</div></div></div>
    </div>
  </div>

  <div id="fire">FIRE</div>
</div>
<script src="app.js"></script>
<script>
const DUR = 3.22;
const bars = document.getElementById('bars');
bars.innerHTML = Array.from({length: 24}, () => '<div class="bar"></div>').join('');
const teleRows = [
  ['TARGET', 'TGT-01 / 0.46 km'],
  ['PROJECTILE', '1,024 g / Fe'],
  ['MUZZLE V', '3,200 m/s'],
  ['CURRENT', '1.84 MA'],
  ['COOLANT', 'NOMINAL'],
];
document.getElementById('tele').innerHTML = teleRows.map(([k,v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('');
const coilEls = document.getElementById('coils');

function frame(t) {
  const p = RG.smooth(t / DUR);
  const pct = Math.min(98.7, 8 + p * 92);
  document.getElementById('pct').innerHTML = String(Math.floor(pct)).padStart(3, '0') + '<span>%</span>';
  document.getElementById('clock').textContent = RG.fmt(t + 50.2);
  [...bars.children].forEach((el, i) => {
    const on = i < Math.floor(pct / 100 * 24);
    el.className = 'bar' + (on ? (i > 18 ? ' hot' : ' on') : '');
  });

  let coils = '';
  for (let i = 0; i < 3; i++) {
    const x = 90 + i * 120, y = 254 - i * 44;
    const glow = RG.clamp((p - i * .16) * 2);
    coils += `<g transform="translate(${x},${y})">
      <rect x="-8" y="-34" width="16" height="68" rx="6" fill="none" stroke="rgba(0,225,255,${.25 + glow * .7})" stroke-width="2"/>
      <rect x="-8" y="-34" width="16" height="68" rx="6" fill="rgba(0,225,255,${.05 + glow * .12})"/>
    </g>`;
  }
  coilEls.innerHTML = coils;

  const f = RG.clamp((t - 2.55) / .18);
  const el = document.getElementById('fire');
  el.style.opacity = f;
  el.style.transform = `scale(${1 + .08 * (1 - f)}) translateX(${20 * (1 - f)}px)`;
}
__boot(frame, DUR);
</script>
</body>
</html>
