<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>04 / MANGA WALL</title>
<link rel="stylesheet" href="base.css">
<style>
  #stage { background: #dcd7cb; }
  #stage::after { background: radial-gradient(ellipse at 50% 46%, transparent 40%, rgba(60,50,40,.35) 100%); }
  .paper-grain { position: absolute; inset: 0; background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 4px),
    radial-gradient(rgba(0,0,0,.05) 1px, transparent 1px);
    background-size: auto, 5px 5px; }
  .wall { position: absolute; inset: 44px 68px 52px; transform: perspective(1400px) rotateY(-5deg) rotateX(1.6deg); transform-origin: 50% 50%; }
  .grid6 { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1.06fr .94fr; gap: 12px; }
  .panel { position: relative; overflow: hidden; background: #111; border: 5px solid #0b0b0b; box-shadow: 0 14px 30px rgba(0,0,0,.35); }
  .panel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.3); }
  .panel::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.10) 1px, transparent 1px); background-size: 4px 4px; mix-blend-mode: screen; opacity: .5; }
  .cap { position: absolute; left: 14px; bottom: 12px; z-index: 3; background: #f4f0e4; color: #0a0a0a; font-weight: 900; padding: 5px 10px; font-size: 17px; border: 2px solid #0a0a0a; }
  .num { position: absolute; right: 10px; top: 8px; z-index: 3; font-family: "Fira Code"; font-size: 13px; color: #fff; background: #0a0a0a; padding: 3px 7px; }
  .speed { position: absolute; inset: 0; z-index: 2; background: repeating-linear-gradient(100deg, transparent 0 22px, rgba(255,255,255,.55) 22px 24px, transparent 24px 46px); mix-blend-mode: screen; opacity: .5; }
  .wide { grid-column: span 2; }
  .title { position: absolute; right: 92px; top: 64px; font-family: "Lato", sans-serif; font-weight: 900; font-size: 30px; letter-spacing: .3em; color: #1a1a1a; }
  .sfx { position: absolute; left: 40px; top: 28px; font-weight: 900; font-size: 92px; color: #fff; -webkit-text-stroke: 3px #0a0a0a; transform: rotate(-7deg); z-index: 4; text-shadow: 6px 6px 0 rgba(0,0,0,.25); }
</style>
</head>
<body>
<div id="stage">
  <div class="paper-grain"></div>
  <div class="wall">
    <div class="grid6">
      <div class="panel"><img src="../assets/ai/03_rain_street.jpg"><div class="num">01</div><div class="cap">雨の街</div></div>
      <div class="panel"><img src="../assets/ai/07_manga_action.jpg"><div class="speed"></div><div class="num">02</div><div class="cap">跳躍</div><span class="sfx">ドン！</span></div>
      <div class="panel"><img src="../assets/ai/10_face_closeup.jpg"><div class="num">03</div><div class="cap">決意</div></div>
      <div class="panel"><img src="../assets/ai/12_muzzle.jpg"><div class="num">04</div><div class="cap">炮口</div></div>
      <div class="panel"><img src="../assets/ai/13_beam_sky.jpg"><div class="speed" style="opacity:.35"></div><div class="num">05</div><div class="cap">放て！</div></div>
      <div class="panel"><img src="../assets/ai/16_train_platform.jpg"><div class="num">06</div><div class="cap">帰り道</div></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
<script>
const DUR = 2.84;
function frame(t) {
  const wall = document.querySelector('.wall');
  const p = RG.smooth(t / DUR);
  wall.style.transform = `perspective(1400px) rotateY(${-5 + 1.2 * p}deg) rotateX(${1.6 - .6 * p}deg) scale(${1.02 - .02 * p})`;
  document.querySelectorAll('.panel').forEach((el, i) => {
    const d = .10 + i * .06;
    const q = RG.smooth((t - d) / .35);
    el.style.opacity = q;
    el.style.transform = `translateY(${26 * (1 - q)}px)`;
  });
}
__boot(frame, DUR);
</script>
</body>
</html>
